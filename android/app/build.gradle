plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.memoriahack.cursos'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.memoriahack.cursos"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    // A chave de assinatura ESTAVEL e injetada pelo GitHub Actions via
    // -Pandroid.injected.signing.* (veja .github/workflows/build-apk.yml).
    // Sem isso, o Gradle usa o debug.keystore da maquina local.
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.browser:browser:1.8.0'   // Chrome Custom Tabs
}
