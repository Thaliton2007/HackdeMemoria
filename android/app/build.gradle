plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.memoriahack.cursos'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.memoriahack.cursos"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // O HTML instrumentado e gerado por ferramentas/gerar_assets_android.py
    // antes do gradle (veja .github/workflows/build-apk.yml).
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
