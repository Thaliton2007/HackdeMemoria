name: Gerar APK do Memoria Hack

on:
  push:
    branches: [ arena/6424d026-hackdememoria ]
    paths:
      - 'app/MemoriaHack_Cursos.html'
      - 'android/**'
      - 'ferramentas/gerar_assets_android.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Conferir HTML de producao
        run: |
          echo "MD5 do hub de producao:"
          md5sum app/MemoriaHack_Cursos.html
          test "$(md5sum app/MemoriaHack_Cursos.html | cut -d' ' -f1)" = "8e547cddce73df56c23093a253e38dcc"

      - name: Gerar HTML instrumentado para o APK
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 ferramentas/gerar_assets_android.py

      - name: Preparar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest ja traz o Android SDK. Nao usamos a action
      # android-actions/setup-android (que quebrou ao ser forcada no Node 24).
      - name: Localizar / instalar Android SDK
        shell: bash
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "SDK=$SDK"
          ls -la "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "sdkmanager ausente; baixando command line tools do Google"
            mkdir -p "$SDK/cmdline-tools/tmpdl"
            curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdline.zip -d "$SDK/cmdline-tools/tmpdl"
            rm -rf "$SDK/cmdline-tools/latest"
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a "$SDK/cmdline-tools/tmpdl/cmdline-tools/." "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SM"
          fi
          echo "$SM" > /tmp/sdkmanager_path
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          java -version 2>&1 || true
          "$SM" --version || true

      - name: Instalar plataforma e build-tools 35
        shell: bash
        run: |
          SM=$(cat /tmp/sdkmanager_path)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          echo "=== plataformas ==="; ls "$ANDROID_HOME/platforms" || true
          echo "=== build-tools ==="; ls "$ANDROID_HOME/build-tools" || true

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug, ja assinado para instalacao direta)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Renomear APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MemoriaHack.apk
          ls -lh MemoriaHack.apk
          sha256sum MemoriaHack.apk

      - name: Verificar conteudo do APK
        shell: bash
        run: |
          set -e
          unzip -l MemoriaHack.apk | grep -E 'AndroidManifest.xml|classes.dex|assets/MemoriaHack_Cursos.html'
          N=$(unzip -p MemoriaHack.apk assets/MemoriaHack_Cursos.html | wc -c)
          echo "HTML dentro do APK: $N bytes"
          test "$N" -gt 9000000
          SHA256=$(sha256sum MemoriaHack.apk | cut -d' ' -f1)
          echo "SHA256: $SHA256"
          echo "$SHA256" > /tmp/apk_sha256

      - name: Guardar como artefato da execucao
        uses: actions/upload-artifact@v4
        with:
          name: MemoriaHack-APK
          path: MemoriaHack.apk
          retention-days: 90

      - name: Publicar link direto de download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG=apk-v1
          SHA256=$(cat /tmp/apk_sha256)
          python3 - > /tmp/blob.json <<'PY'
          import base64, json
          print(json.dumps({
              "content": base64.b64encode(open("MemoriaHack.apk", "rb").read()).decode(),
              "encoding": "base64"
          }))
          PY
          BLOB=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha)
          echo "blob git: $BLOB"
          cat > /tmp/note.md <<'NOTE'
          APK de uso pessoal do Memoria Hack (Espanhol, Ingles e Frances). Baixe **MemoriaHack.apk** abaixo e instale no celular. O passo a passo esta em COMO_INSTALAR_APK.md no repositorio.

          Curso completo embutido: cartas, SRS, testes e provoes funcionam sem internet. Videos e PDFs do Drive abrem no Chrome.

          SHA-256: `__SHA__`

          <!-- build-info blob=__BLOB__ -->
          NOTE
          sed -i "s/__SHA__/$SHA256/; s/__BLOB__/$BLOB/" /tmp/note.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Memoria Hack - APK" --notes-file /tmp/note.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Memoria Hack - APK" --notes-file /tmp/note.md
          fi
          gh release upload "$TAG" MemoriaHack.apk --clobber
          echo "Link direto: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/MemoriaHack.apk"

      # Diagnostico: mesmo em caso de falha, guarda o log do gradle.
      - name: Guardar diagnostico (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-build
          path: |
            android/gradle-build.log
            android/local.properties
          if-no-files-found: ignore
          retention-days: 14
